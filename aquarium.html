<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Interactive Aquarium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('assets/images/aquarium/indexFinger.png') 10 0, pointer;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html {
            cursor: url('assets/images/aquarium/indexFinger.png') 10 0, pointer;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a2a4b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            cursor: url('assets/images/aquarium/indexFinger.png') 10 0, pointer;
            overflow: hidden;
        }

        @media (max-width: 768px), (pointer: coarse) {
            html, body {
                width: 100vw;
                height: 100vh;
                padding: 0;
                margin: 0;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }
            
            body {
                padding: 0;
                min-height: 100vh;
                align-items: stretch;
                justify-content: stretch;
                flex: 1;
                width: 100vw;
                height: 100vh;
            }
        }

        .aquarium-container {
            width: 100%;
            max-width: 1200px;
            background: linear-gradient(to bottom, #1a4d6d, #0d2a3a);
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 150, 255, 0.3);
            overflow: hidden;
            border: 3px solid #00d4ff;
            position: relative;
            flex-shrink: 0;
        }

        @media (max-width: 768px), (pointer: coarse) {
            html, body {
                height: 100dvh;
                overscroll-behavior: none;
                touch-action: none;
                background: #0a0e27;
            }

            .aquarium-container {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                max-width: 100vw;
                max-height: 100dvh;
                border-radius: 0;
                border: none;
                box-shadow: none;
                display: flex;
                flex-direction: column;
                position: fixed;
                top: 0;
                left: 0;
                margin: 0;
                padding: 0;
                flex-shrink: 0;
            }
        }



        canvas {
            display: block;
            background: linear-gradient(180deg, 
                rgba(26, 77, 109, 0.8) 0%,
                rgba(13, 42, 58, 0.9) 100%);
            cursor: url('assets/images/aquarium/indexFinger.png') 10 0, pointer;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }

        @media (max-width: 768px), (pointer: coarse) {
            canvas {
                width: 100% !important;
                height: 100% !important;
                display: block;
                max-width: 100vw;
                max-height: 100dvh;
                margin: 0;
                padding: 0;
            }
        }

        .popup-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            animation: popupFade 3s ease-out forwards;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .popup-message:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }

        .popup-message img {
            max-width: 90vw;
            height: auto;
            display: block;
        }

        @keyframes popupFade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.2);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.6);
            }
        }

        .exit-button {
            position: absolute;
            top: -35px;
            left: 0px;
            padding: 0;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 50;
            transition: all 0.3s ease;
        }

        @media (max-width: 768px), (pointer: coarse) {
            .exit-button {
                right: auto;
                position: fixed;
                z-index: 100;
                touch-action: manipulation;
            }

        }

        .exit-button img {
            height: 150px;
            width: auto;
            display: block;
        }

        @media (max-width: 768px), (pointer: coarse) {
            .exit-button {
                top: calc(4px + env(safe-area-inset-top));
                left: calc(8px + env(safe-area-inset-left));
            }

            /* exitButton.png is square with lots of transparent padding: crop it */
            .exit-button img {
                height: 42px;
                width: auto;
                aspect-ratio: 891 / 477;
                object-fit: cover;
                filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.35));
            }
        }

        .exit-button:hover {
            transform: scale(1.1);
        }

        .thank-you-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            animation: thankYouFade 2s ease-out forwards;
            pointer-events: none;
        }

        .thank-you-message img {
            max-width: 90vw;
            height: auto;
            display: block;
        }

        @keyframes thankYouFade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.2);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.6);
            }
        }

        .feed-button {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
            transition: all 0.3s ease;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .feed-button:active {
            transform: translateX(-50%) scale(0.95);
        }

        .feed-button.holding {
            background: linear-gradient(135deg, #00ff88 0%, #00dd66 100%);
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.6);
        }

        @media (max-width: 768px), (pointer: coarse) {
            .feed-button {
                display: flex;
                align-items: center;
                gap: 10px;
                position: fixed;
                bottom: calc(14px + env(safe-area-inset-bottom));
                right: calc(16px + env(safe-area-inset-right));
                left: auto;
                transform: none;
                z-index: 100;
                padding: 8px 20px 8px 8px;
                border-radius: 999px;
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0.4px;
                color: #fff;
                text-shadow: 0 1px 2px rgba(0, 60, 90, 0.5);
                background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 50%),
                            linear-gradient(135deg, #ffb347 0%, #ff7a45 55%, #ff5e62 100%);
                border: 2px solid rgba(255, 255, 255, 0.7);
                box-shadow: 0 6px 18px rgba(255, 94, 98, 0.45),
                            inset 0 -3px 0 rgba(0, 0, 0, 0.12);
                transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease;
            }

            .feed-button .feed-icon {
                width: 34px;
                height: 34px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                font-size: 19px;
                background: rgba(255, 255, 255, 0.9);
                box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.08);
            }

            .feed-button:active {
                transform: scale(0.94);
            }

            .feed-button.holding {
                background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 50%),
                            linear-gradient(135deg, #7cf29a 0%, #1fd18a 55%, #0fb5a0 100%);
                box-shadow: 0 0 0 6px rgba(31, 209, 138, 0.25), 0 6px 20px rgba(31, 209, 138, 0.55);
            }

            .feed-button.holding .feed-icon {
                animation: shake 0.25s ease-in-out infinite alternate;
            }

            @keyframes shake {
                from { transform: rotate(-12deg); }
                to { transform: rotate(12deg); }
            }
        }

        /* Info Icon for Feed Instructions */
        .info-icon {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            cursor: pointer;
            z-index: 150;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
            transition: all 0.3s ease;
            animation: pulse 2s ease-in-out infinite;
            font-weight: bold;
        }

        .info-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.6);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.8;
                box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
            }
            50% {
                opacity: 1;
                box-shadow: 0 4px 25px rgba(0, 212, 255, 0.5);
            }
        }

        .info-tooltip {
            position: fixed;
            top: 70px;
            right: 20px;
            background: rgba(0, 20, 40, 0.95);
            color: #00d4ff;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: none;
            z-index: 150;
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.2);
            white-space: nowrap;
            animation: slideIn 0.3s ease-out;
            pointer-events: none;
        }

        .info-tooltip.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px), (pointer: coarse) {
            .info-icon {
                width: 38px;
                height: 38px;
                font-size: 20px;
                top: calc(14px + env(safe-area-inset-top));
                right: calc(14px + env(safe-area-inset-right));
            }

            .info-tooltip {
                top: calc(60px + env(safe-area-inset-top));
                right: calc(14px + env(safe-area-inset-right));
                font-size: 12px;
                padding: 12px 16px;
                white-space: normal;
                max-width: 200px;
            }
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #1a2a4b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
            opacity: 1;
            visibility: visible;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 212, 255, 0.2);
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-bar {
            width: min(260px, 60vw);
            height: 8px;
            border-radius: 999px;
            background: rgba(0, 212, 255, 0.15);
            overflow: hidden;
            margin-top: 16px;
        }

        .loading-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            transition: width 0.2s ease;
        }

        .rotate-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: linear-gradient(135deg, #0a0e27 0%, #1a2a4b 100%);
            color: #fff;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            font-size: 22px;
            font-weight: 600;
            padding: 24px;
        }

        .rotate-overlay small {
            display: block;
            margin-top: 8px;
            font-size: 15px;
            font-weight: 400;
            color: #7fdcff;
        }

        .rotate-phone {
            width: 60px;
            height: 100px;
            border: 4px solid #00d4ff;
            border-radius: 12px;
            position: relative;
            animation: rotatePhone 2s ease-in-out infinite;
        }

        .rotate-phone::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            width: 10px;
            height: 10px;
            margin-left: -5px;
            border-radius: 50%;
            background: #00d4ff;
        }

        @keyframes rotatePhone {
            0%, 20% { transform: rotate(0deg); }
            60%, 100% { transform: rotate(-90deg); }
        }

        /* Phones: landscape only */
        @media (pointer: coarse) and (orientation: portrait) {
            .rotate-overlay { display: flex; }
        }

        .loading-text {
            color: #00d4ff;
            font-size: 18px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 300;
            letter-spacing: 1px;
        }
    </style>

</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Aquarium...</div>
        <div class="loading-bar"><div class="loading-bar-fill" id="loadingBarFill"></div></div>
    </div>

    <div class="rotate-overlay" id="rotateOverlay">
        <div class="rotate-phone"></div>
        <div>Please rotate your phone<small>The aquarium only works in landscape mode</small></div>
    </div>
    
    <div class="info-icon" id="infoIcon">ℹ️</div>
    <div class="info-tooltip" id="infoTooltip">Press SPACE or tap to feed</div>
    
    <div class="aquarium-container">
        <button class="exit-button" id="exitButton">
            <img src="assets/images/aquarium/exitButton.png" alt="Exit Aquarium">
        </button>
        <canvas id="aquariumCanvas"></canvas>
    </div>
    <div class="popup-message" id="popupMessage" style="display: none;">
        <img src="assets/images/aquarium/pressSpaceToFeed.png" alt="Press Space to Feed">
    </div>
    <button class="feed-button" id="feedButton"><span class="feed-icon">🍤</span><span>Feed Fish</span></button>
    <div class="thank-you-message" id="thankYouMessage" style="display: none;">
        <img src="assets/images/aquarium/thanksForSwimmingBy.png" alt="Thanks for Swimming By">
    </div>

    <script>
        // ============================================================================
        // MOBILE / TOUCH SETUP
        // ============================================================================

        let gameInitialized = false;
        let gameLoopRunning = false;

        // Phones in landscape are often wider than 768px, so detect touch instead of width
        const isTouchDevice = window.matchMedia('(pointer: coarse)').matches ||
            'ontouchstart' in window || navigator.maxTouchPoints > 0;
        if (isTouchDevice) document.documentElement.classList.add('touch');

        // ============================================================================
        // AQUARIUM CANVAS SETUP
        // ============================================================================

        const canvas = document.getElementById('aquariumCanvas');
        const ctx = canvas.getContext('2d');

        // Logical (CSS pixel) size of the canvas; the backing store is scaled by devicePixelRatio
        let viewW = 0;
        let viewH = 0;
        let spriteScale = 1;

        // Static background image used until the video is ready (and as fallback on iOS)
        const backgroundImage = new Image();
        backgroundImage.src = 'assets/images/aquarium/aquariumBackground.jpeg';

        // Where the background is drawn: 'stretch' (wide screens) or 'cover' (portrait phones)
        let bgRect = { x: 0, y: 0, w: 0, h: 0, cover: false };

        // Aquarium boundaries (constrain to tank area within the background image)
        let aquariumBounds = {
            left: 0,
            right: 0,
            top: 0,
            bottom: 0
        };

        // Tank water area as fractions of the background image
        const TANK = { left: 0.06, right: 0.945, top: 0.22, bottom: 0.82 };
        const BG_ASPECT = 1408 / 730;

        function updateAquariumBounds() {
            const aspect = viewW / viewH;
            if (aspect >= 1.3) {
                // Wide screen: stretch background over the whole canvas (original behaviour)
                bgRect = { x: 0, y: 0, w: viewW, h: viewH, cover: false };
            } else {
                // Portrait / narrow: crop the background ("cover") so the tank fills the screen
                const h = viewH;
                const w = h * BG_ASPECT;
                bgRect = { x: (viewW - w) / 2, y: 0, w, h, cover: true };
            }
            const margin = 8;
            aquariumBounds = {
                left: Math.max(margin, bgRect.x + bgRect.w * TANK.left),
                right: Math.min(viewW - margin, bgRect.x + bgRect.w * TANK.right),
                top: bgRect.y + bgRect.h * TANK.top,
                bottom: bgRect.y + bgRect.h * TANK.bottom
            };
        }

        // Set canvas size
        function resizeCanvas() {
            const container = canvas.parentElement;

            if (isTouchDevice || window.innerWidth < 768) {
                // Mobile: fill the whole (visual) viewport, portrait or landscape
                const vv = window.visualViewport;
                viewW = Math.round(vv ? vv.width : window.innerWidth);
                viewH = Math.round(vv ? vv.height : window.innerHeight);
                // Smaller sprites on small screens
                spriteScale = Math.max(0.55, Math.min(1, Math.min(viewW, viewH) / 600));
            } else {
                // Desktop - maintain aspect ratio
                viewW = container.clientWidth || window.innerWidth;
                viewH = Math.max(500, window.innerHeight * 0.7);
                spriteScale = 1;
            }

            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(viewW * dpr);
            canvas.height = Math.round(viewH * dpr);
            canvas.style.height = viewH + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.imageSmoothingQuality = 'high';
            updateAquariumBounds();
        }
        resizeCanvas();

        let resizeTimer;
        function onViewportChange() {
            clearTimeout(resizeTimer);
            // Give mobile browsers a moment to settle their dimensions after rotation
            resizeTimer = setTimeout(resizeCanvas, 120);
        }
        window.addEventListener('resize', onViewportChange);
        window.addEventListener('orientationchange', onViewportChange);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', onViewportChange);

        // Load background video
        const backgroundVideo = document.createElement('video');
        backgroundVideo.src = 'assets/images/aquarium/aquariumBackground.mp4';
        backgroundVideo.loop = true;
        backgroundVideo.muted = true;
        backgroundVideo.preload = 'auto';
        // Required for inline autoplay on iOS Safari / mobile Chrome
        backgroundVideo.playsInline = true;
        backgroundVideo.setAttribute('playsinline', '');
        backgroundVideo.setAttribute('webkit-playsinline', '');
        backgroundVideo.setAttribute('muted', '');
        backgroundVideo.autoplay = true;
        let backgroundLoaded = false;

        // Some mobile browsers only start the video after a user gesture
        function ensureVideoPlaying() {
            if (backgroundVideo.paused) {
                backgroundVideo.play().catch(() => {});
            }
        }
        document.addEventListener('touchstart', ensureVideoPlaying, { passive: true });
        document.addEventListener('pointerdown', ensureVideoPlaying);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) ensureVideoPlaying();
        });
        
        // Load video in background without blocking game start
        backgroundVideo.addEventListener('canplay', () => {
            backgroundLoaded = true;
            backgroundVideo.play().catch(() => {
                // Silently fail if autoplay is blocked
            });
        }, { once: true });
        

        // ============================================================================
        // FISH TYPES & PROPERTIES
        // ============================================================================

        // ============================================================================
        // GAME OBJECTS
        // ============================================================================

        class Food {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vy = 1 + Math.random() * 1;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.nutrition = 30;
                this.size = 4;
                this.eaten = false;
                this.touchedFloor = false;
                this.floorTimer = 0;
                // Random colorful food
                const colors = ['#FF6B6B', '#FFD700', '#FF1493', '#00FF7F', '#00BFFF', '#FFB347', '#FF69B4', '#32CD32'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.vy;
                this.x += this.vx;

                // Keep food within aquarium bounds with margin
                if (this.x < aquariumBounds.left + 5) this.x = aquariumBounds.left + 5;
                if (this.x > aquariumBounds.right - 5) this.x = aquariumBounds.right - 5;

                // Stop at bottom of aquarium
                if (this.y > aquariumBounds.bottom - 10) {
                    this.y = aquariumBounds.bottom - 10;
                    this.vy = 0;
                    if (!this.touchedFloor) {
                        this.touchedFloor = true;
                        this.floorTimer = 180; // 3 seconds at 60 FPS
                    }
                }

                // Count down timer after touching floor
                if (this.touchedFloor) {
                    this.floorTimer--;
                }
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Glow
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size + 3, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        class Bubble {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vy = -0.5 - Math.random() * 0.5;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.radius = 2 + Math.random() * 4;
                this.life = 200;
            }

            update() {
                this.y += this.vy;
                this.x += this.vx;
                this.life--;
            }

            draw(ctx) {
                ctx.strokeStyle = `rgba(0, 200, 255, ${this.life / 200})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        class Plant {
            constructor(x, baseY) {
                this.x = x;
                this.baseY = baseY;
                this.height = 40 + Math.random() * 60;
                this.waveOffset = Math.random() * Math.PI * 2;
                this.waveSpeed = 0.02 + Math.random() * 0.02;
            }

            draw(ctx) {
                ctx.strokeStyle = '#2ECC71';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(this.x, this.baseY);

                for (let i = 0; i < this.height; i += 5) {
                    const wave = Math.sin(this.waveOffset + i * 0.1) * 5;
                    ctx.lineTo(this.x + wave, this.baseY - i);
                }
                ctx.stroke();

                this.waveOffset += this.waveSpeed;
            }
        }

        class Shell {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.bubbleTimer = 0;
            }

            update() {
                this.bubbleTimer++;
            }

            draw(ctx) {

                this.image.src = 'assets/images/aquarium/zebradanio.png';
                this.imageLoaded = false;
                this.image.onload = () => { this.imageLoaded = true; };
                this.direction = this.vx > 0 ? 1 : -1;
                this.verticalTilt = 0;
                this.targetFood = null;
                this.awareness = 200;
            }

            findNearestFood(foods) {
                let nearest = null;
                let minDist = this.awareness;
                for (let food of foods) {
                    const dist = Math.hypot(food.x - this.x, food.y - this.y);
                    if (dist < minDist) { nearest = food; minDist = dist; }
                }
                return nearest;
            }

            update(mouseX, mouseY, foods) {
                const mouseDistX = mouseX - this.x;
                const mouseDistY = mouseY - this.y;
                const mouseDist = Math.hypot(mouseDistX, mouseDistY);
                if (mouseDist < 150) {
                    this.vx = -mouseDistX / mouseDist * 2;
                    this.vy = -mouseDistY / mouseDist * 1.5;
                } else {
                    this.targetFood = this.findNearestFood(foods);
                    if (this.targetFood) {
                        const dx = this.targetFood.x - this.x;
                        const dy = this.targetFood.y - this.y;
                        const dist = Math.hypot(dx, dy);
                        this.vx = (dx / dist) * 2;
                        this.vy = (dy / dist) * 1.5;
                        if (dist < 20) { this.targetFood.eaten = true; this.targetFood = null; }
                    } else {
                        if (Math.random() < 0.02) { this.vx = (Math.random() - 0.5) * 2; this.vy = (Math.random() - 0.5) * 1; }
                    }
                }
                if (this.vx > 0.1) { this.direction = 1; } else if (this.vx < -0.1) { this.direction = -1; }
                if (Math.abs(this.vx) > 0.1) { this.verticalTilt = Math.atan(this.vy / Math.abs(this.vx)) * 0.5; } else if (Math.abs(this.vy) > 0.1) { this.verticalTilt = Math.atan(this.vy / 0.1) * 0.5; }
                this.x += this.vx;
                this.y += this.vy;
                const ext = this.size / 2;
                if (this.x - ext < aquariumBounds.left) { this.x = aquariumBounds.left + ext; this.vx = Math.abs(this.vx); }
                if (this.x + ext > aquariumBounds.right) { this.x = aquariumBounds.right - ext; this.vx = -Math.abs(this.vx); }
                if (this.y - ext < aquariumBounds.top) this.y = aquariumBounds.top + ext;
                if (this.y + ext > aquariumBounds.bottom) this.y = aquariumBounds.bottom - ext;
            }

            draw(ctx) {
                if (this.imageLoaded) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.scale(spriteScale, spriteScale);
                    if (this.direction === -1) ctx.scale(-1, 1);
                    ctx.rotate(this.verticalTilt);
                    ctx.drawImage(this.image, -this.size / 2, -this.size / 2, this.size, this.size);
                    ctx.restore();
                }
            }
        }

        document.addEventListener('mousemove', (e) => {

            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        // Touch screen support - same effect as mouse movement
        document.addEventListener('touchmove', (e) => {
            // Only prevent default if touch is within canvas
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                e.preventDefault();
            }
            mouseX = touch.clientX - rect.left;
            mouseY = touch.clientY - rect.top;
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            // Move cursor away from canvas when touch ends
            if (e.touches.length === 0) {
                mouseX = -1000;
                mouseY = -1000;
            }
        });

        // Double-tap to feed fish (touch screen support)
        let lastTapTime = 0;
        let tapCount = 0;
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // no double-tap zoom / ghost clicks
            const t = e.touches[0];
            const r = canvas.getBoundingClientRect();
            mouseX = t.clientX - r.left;
            mouseY = t.clientY - r.top;
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            
            if (tapLength < 300 && tapLength > 0) {
                // Double tap detected
                tapCount++;
                if (tapCount === 2) {
                    // Spawn food like pressing space
                    for (let i = 0; i < 5; i++) {
                        const x = Math.random() * (aquariumBounds.right - aquariumBounds.left) + aquariumBounds.left;
                        const y = aquariumBounds.top + Math.random() * (aquariumBounds.bottom - aquariumBounds.top) * 0.2;
                        foods.push(new Food(x, y));
                        foodSpawned++;
                    }
                    tapCount = 0;
                }
            } else {
                tapCount = 1;
            }
            lastTapTime = currentTime;
        }, { passive: false });

        function update() {
            // Update food
            for (let i = foods.length - 1; i >= 0; i--) {
                foods[i].update();
                if (foods[i].eaten || (foods[i].touchedFloor && foods[i].floorTimer <= 0)) {
                    foods.splice(i, 1);
                }
            }

            // Update bubbles
            for (let i = bubbles.length - 1; i >= 0; i--) {
                bubbles[i].update();
                if (bubbles[i].life <= 0) {
                    bubbles.splice(i, 1);
                }
            }

            // Create random bubbles from bottom
            if (Math.random() < 0.20) {
                const x = aquariumBounds.left + Math.random() * (aquariumBounds.right - aquariumBounds.left);
                bubbles.push(new Bubble(x, aquariumBounds.bottom));
            }

            // Update jellyfish
            for (let j of jellyfish) {
                j.update(mouseX, mouseY);
            }

            // Update crabs
            for (let c of crabs) {
                c.update(mouseX, mouseY);
            }

            // Update clownfish
            for (let cf of clownfish) {
                cf.update(mouseX, mouseY, foods);
            }

        function draw() {
            // Draw background video (or the static image until the video is playing)
            ctx.clearRect(0, 0, viewW, viewH);
            if (backgroundLoaded && backgroundVideo.readyState >= 2) {
                ctx.drawImage(backgroundVideo, bgRect.x, bgRect.y, bgRect.w, bgRect.h);
            } else if (backgroundImage.complete && backgroundImage.naturalWidth > 0) {
                ctx.drawImage(backgroundImage, bgRect.x, bgRect.y, bgRect.w, bgRect.h);
            } else {
                // Fallback gradient if nothing is loaded yet
                const gradient = ctx.createLinearGradient(0, 0, 0, viewH);
                gradient.addColorStop(0, 'rgba(26, 77, 109, 0.6)');
                gradient.addColorStop(1, 'rgba(13, 42, 58, 0.8)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, viewW, viewH);
            }

            // Draw food
            for (let food of foods) {
                food.draw(ctx);
            }

            // Draw bubbles
            for (let bubble of bubbles) {
                bubble.draw(ctx);
            }

            // Draw jellyfish
            for (let j of jellyfish) {
                j.draw(ctx);
            }

            // Draw crabs
            for (let c of crabs) {
                c.draw(ctx);
            }

            // Draw clownfish
            for (let cf of clownfish) {
                cf.draw(ctx);
            }

            // Draw bettafish
            for (let bf of bettafish) {
                bf.draw(ctx);
            }

            // Draw angelfish
            for (let af of angelfish) {
                af.draw(ctx);
            }

            // Draw angelfish2
            for (let af2 of angelfish2) {
                af2.draw(ctx);
            }

            // Draw bettafish2
            for (let bf2 of bettafish2) {
                bf2.draw(ctx);
            }

            // Draw corydoras
            for (let cd of corydoras) {
                cd.draw(ctx);
            }

            // Draw discus
            for (let ds of discus) {
                ds.draw(ctx);
            }

            // Draw fancy goldfish
            for (let fg of fancyGoldfish) {
                fg.draw(ctx);
            }

            // Draw goldfish
            for (let gf of goldfish) {
                gf.draw(ctx);
            }

            // Draw guppyfish
            for (let gy of guppyfish) {
                gy.draw(ctx);
            }

            // Draw koifish
            for (let kf of koifish) {
                kf.draw(ctx);
            }

            // Draw neon tetra
            for (let nt of neontetra) {
                nt.draw(ctx);
            }

            // Draw zebra danio
            for (let zd of zebradanio) {
                zd.draw(ctx);
            }

            // Draw shrimp
            for (let sr of shrimp) {
                sr.draw(ctx);
            }

            // Draw pufferfish
            for (let pf of pufferfish) {
                pf.draw(ctx);
            }
        }

        const STEP = 1000 / 60;
        let lastFrameTime = 0;
        let accumulator = 0;
        function gameLoop(now) {
            now = now || performance.now();
            if (!lastFrameTime) lastFrameTime = now;
            // Clamp large gaps (e.g. tab in background) to avoid a burst of updates
            accumulator += Math.min(now - lastFrameTime, 250);
            lastFrameTime = now;
            let steps = 0;
            while (accumulator >= STEP && steps < 5) {
                update();
                accumulator -= STEP;
                steps++;
            }
            if (steps === 5) accumulator = 0;
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game function with initialization tracking
        function startGame() {
            if (!gameInitialized) {
                gameInitialized = true;
                resizeCanvas();
                init();
            }
            if (!gameLoopRunning) {
                gameLoopRunning = true;
                gameLoop();
            }
        }

        // Load EVERY asset (all fish, background image + video) before the game starts
        const ASSET_DIR = 'assets/images/aquarium/';
        const ALL_IMAGES = [
            'aquariumBackground.jpeg', 'exitButton.png', 'thanksForSwimmingBy.png', 'indexFinger.png',
            'jellyfish1.png', 'jellyfish2.png', 'crab.png', 'clownfish.png', 'bettafish.png',
            'bettafish2.png', 'angelfish.png', 'angelfish2.png', 'corydoras.png', 'discus.png',
            'fancyGoldfish.png', 'goldfish.png', 'guppyfish.png', 'koifish.png', 'neontetra.png',
            'zebradanio.png', 'shrimp.png', 'pufferfish.png'
        ];

        function loadImage(src) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = img.onerror = () => resolve();
                img.src = ASSET_DIR + src;
            });
        }

        function loadVideo() {
            return new Promise(resolve => {
                if (backgroundVideo.readyState >= 3) return resolve();
                backgroundVideo.addEventListener('canplaythrough', resolve, { once: true });
                backgroundVideo.addEventListener('error', resolve, { once: true });
                // ponytail: some mobile browsers never buffer a video before a user gesture;
                // don't block forever, the static background covers until it plays
                setTimeout(resolve, 10000);
                backgroundVideo.load();
            });
        }

        function preloadAquariumAssets() {
            const tasks = ALL_IMAGES.map(loadImage).concat(loadVideo());
            const fill = document.getElementById('loadingBarFill');
            let done = 0;
            tasks.forEach(t => t.then(() => {
                done++;
                fill.style.width = Math.round(done / tasks.length * 100) + '%';
            }));
            return Promise.all(tasks);
        }

        let assetsReady = false;

        function isPortraitPhone() {
            return isTouchDevice && window.innerHeight > window.innerWidth;
        }

        // Start only when everything is loaded AND (on phones) we are in landscape
        function tryStartGame() {
            if (!assetsReady || gameLoopRunning || isPortraitPhone()) return;
            document.getElementById('loadingScreen').classList.add('hidden');
            startGame();
        }

        window.addEventListener('resize', () => setTimeout(tryStartGame, 150));
        window.addEventListener('orientationchange', () => setTimeout(tryStartGame, 150));

        preloadAquariumAssets().then(() => {
            assetsReady = true;
            tryStartGame();
        });
    </script>
</body>
